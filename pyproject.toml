[project]
name = "bottle3d"
version = "0.1.0"
description = "PDF drawing of glass bottle -> revolved 3D model for Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pyside6>=6.12.0",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.4",
]

[project.scripts]
bottle3d = "bottle3d.cli:main"

[project.gui-scripts]
bottle3d-gui = "bottle3d.gui.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"blender/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: needs Blender (bpy or blender executable)"]
