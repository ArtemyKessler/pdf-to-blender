name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pyinstaller --noconfirm packaging/bottle3d.spec
      - name: Smoke-test the frozen app's core
        shell: pwsh
        run: |
          Test-Path dist/PdfToBlender/PdfToBlender.exe
          Test-Path dist/PdfToBlender/_internal/blender/build_bottle.py
      - uses: actions/upload-artifact@v4
        with:
          name: PdfToBlender-windows
          path: dist/PdfToBlender
